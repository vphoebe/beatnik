name: Publish Docker image (feature branch)
on:
  push:
    branches-ignore:
      - main
      - next
jobs:
  push_to_registry:
    name: (Feature branch) Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Sanitize branch name for Docker tag
        id: branch
        run: echo "tag=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')" >> $GITHUB_OUTPUT
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: nickseman/beatnik:${{ steps.branch.outputs.tag }}
          target: prod
          cache-from: type=gha
          cache-to: type=gha,mode=max
